; VarioSmooth v2 firmware
; Prototype: Adafruit Feather nRF52840 Express + MS5611 breakout (I2C)

[platformio]
default_envs = feather_nrf52840

[env:feather_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    ; Debug output (src/debug_out.h): 0 = none (power measurements),
    ; 1 = USB serial (keeps HFCLK running), 2 = SEGGER RTT over SWD
    -DDEBUG_OUTPUT=1

; Debug output over SWD (RTT) instead of USB, for the helmet board without USB.
; Read with a CMSIS-DAP probe on the SWD pads:
; probe-rs attach --chip nRF52840_xxAA .pio/build/rtt/firmware.elf
[env:rtt]
extends = env:feather_nrf52840
build_flags =
    -Wall
    -DDEBUG_OUTPUT=2

; Test: sends a constant climb rate in $LK8EX1, to check whether the app uses it
; pio run -e fake_climb -t upload
[env:fake_climb]
extends = env:feather_nrf52840
build_flags =
    ${env:feather_nrf52840.build_flags}
    -DFAKE_CLIMB_CMS=300
